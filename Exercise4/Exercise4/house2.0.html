<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Exercise 4.1 - My House and Garden</title></head>
<body>
<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- sky (rect) -->
  <rect x="0" y="0" width="400" height="300" fill="#87ceeb"/>
  <!-- grass (rect) -->
  <rect x="0" y="190" width="400" height="110" fill="#2e8b57"/>

  <!-- sun (circle) + rays (lines) -->
  <circle cx="340" cy="50" r="24" fill="gold"/>
  <g stroke="gold" stroke-width="3">
    <line x1="340" y1="12" x2="340" y2="20"/>
    <line x1="340" y1="80" x2="340" y2="88"/>
    <line x1="302" y1="50" x2="310" y2="50"/>
    <line x1="370" y1="50" x2="378" y2="50"/>
  </g>

  <!-- clouds (group of ellipses, moved with translate) -->
  <g fill="white" opacity="0.9">
    <g transform="translate(60,40)">
      <ellipse cx="0" cy="0" rx="28" ry="12"/>
      <ellipse cx="18" cy="-8" rx="18" ry="10"/>
    </g>
    <g transform="translate(200,70) scale(0.8)">
      <ellipse cx="0" cy="0" rx="28" ry="12"/>
      <ellipse cx="18" cy="-8" rx="18" ry="10"/>
    </g>
  </g>

  <!-- house body (rect) -->
  <rect x="130" y="120" width="140" height="90" fill="#b5651d"/>
  <!-- roof (polygon) -->
  <polygon points="115,120 200,60 285,120" fill="#8b2500"/>
  <!-- chimney (rect) + smoke (path) -->
  <rect x="235" y="68" width="16" height="36" fill="#555"/>
  <path d="M243 62 C235 50, 255 42, 245 30" fill="none" stroke="#ddd" stroke-width="4" stroke-linecap="round"/>

  <!-- door (rect) -->
  <rect x="188" y="160" width="28" height="50" fill="#4b2e12"/>

  <!-- two windows in a group: shared style, positioned with translate -->
  <g fill="#cfefff" stroke="#4b2e12" stroke-width="3">
    <rect x="0" y="0" width="28" height="28" transform="translate(145,145)"/>
    <rect x="0" y="0" width="28" height="28" transform="translate(227,145)"/>
  </g>

  <!-- path (path, curved) -->
  <path d="M202 300 C160 265, 250 240, 202 210" fill="none" stroke="#e8a33d" stroke-width="10" stroke-linecap="round"/>

  <!-- tree 1: trunk (rect) + leaves (circles) -->
  <rect x="55" y="140" width="12" height="60" fill="#8b5a2b"/>
  <circle cx="61" cy="125" r="28" fill="#228b22"/>
  <circle cx="45" cy="138" r="18" fill="#2f9e2f"/>
  <!-- tree 2: smaller, mirrored using transform -->
  <g transform="translate(330,215) scale(0.7)">
    <rect x="-6" y="-60" width="12" height="60" fill="#8b5a2b"/>
    <ellipse cx="0" cy="-75" rx="30" ry="28" fill="#1e7a1e"/>
  </g>


  <!-- sign post: line + rect + text -->
  <line x1="290" y1="205" x2="290" y2="228" stroke="#5a3a1a" stroke-width="4"/>
  <rect x="262" y="190" width="56" height="18" fill="#f5deb3" stroke="#5a3a1a" stroke-width="2"/>
  <text x="290" y="203" font-size="10" text-anchor="middle" fill="#3b2412">My Home</text>
</svg>
</body>
</html>
